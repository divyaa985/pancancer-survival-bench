[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcsurv"
version = "0.1.0"
description = "Does gene expression improve cancer prognosis over clinical variables?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scikit-survival>=0.22",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 95

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
